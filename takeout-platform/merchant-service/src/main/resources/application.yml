server:
  port: 8083

spring:
  application:
    name: merchant-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: 47.99.34.251:8848
        username: nacos
        password: nacos
      config:
        server-addr: 47.99.34.251:8848
        username: nacos
        password: nacos
        file-extension: yaml
        import-check:
          enabled: false

  # H2 内存数据库配置（临时使用）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:takeout_merchant;DB_CLOSE_DELAY=-1;MODE=MySQL;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
    username: sa
    password: 

  # H2 控制台（可选，用于调试）
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto