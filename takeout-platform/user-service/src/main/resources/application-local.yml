# ===== Local Development Config =====
# Usage: --spring.profiles.active=local
spring:
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
      # Point config to non-existent port so spring.config.import fails silently
      # This prevents Nacos remote config from overriding local properties
      config:
        server-addr: localhost:18848
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/takeout_user?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  data:
    redis:
      host: localhost
      password: ""
