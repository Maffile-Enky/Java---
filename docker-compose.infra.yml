# 服务器1 - 基础设施层 (47.99.34.251)
# docker-compose.infra.yml

services:
  # ============ Infrastructure ============
  nacos:
    image: nacos/nacos-server:v2.4.0
    container_name: takeout-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=
      - JVM_XMS=256m
      - JVM_XMX=256m
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: takeout-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
    volumes:
      - mysql-data:/var/lib/mysql
      - ./takeout-platform/sql:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7  
    container_name: takeout-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: takeout-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=takeout
      - RABBITMQ_DEFAULT_PASS=123456
    restart: unless-stopped

  # ============ Gateway & Frontend ============
  gateway:
    image: takeout/gateway:latest
    container_name: takeout-gateway
    ports:
      - "9999:9999"
    environment:
      - NACOS_SERVER_ADDR=nacos:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
    depends_on:
      - nacos
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    image: takeout-frontend:v1.5
    container_name: takeout-frontend
    ports:
      - "80:80"
    depends_on:
      - gateway
    restart: unless-stopped

  # ============ Monitoring ============
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: takeout-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: takeout-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/takeout.json
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql-data:
