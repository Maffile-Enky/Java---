  search-service:
    image: takeout/search-service:latest
    container_name: takeout-search
    ports:
      - "8088:8088"
    environment:
      - NACOS_SERVER_ADDR=47.99.34.251:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - NACOS_DISCOVERY_IP=121.41.228.22
      - MYSQL_HOST=47.99.34.251
      - MYSQL_PORT=3306
      - MYSQL_PASSWORD=123456
    depends_on:
      - nacos-check
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 辅助服务：等待 Nacos 就绪
  nacos-check:
    image: alpine
    container_name: nacos-check
    command: >
      sh -c "
        echo 'Waiting for Nacos to be ready...';
        until wget -q -O- http://47.99.34.251:8848/nacos/v1/console/health/readiness 2>/dev/null; do
          echo 'Nacos not ready, waiting...';
          sleep 5;
        done;
        echo 'Nacos is ready!';
      "
    restart: "no"
