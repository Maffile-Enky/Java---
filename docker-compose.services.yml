# 服务器2 - 业务服务层 (121.41.228.22)
# docker-compose.services.yml
# 使用方法: docker-compose -f docker-compose.services.yml up -d

services:
  # ============ Application Services ============
  user-service:
    image: takeout/user-service:latest
    container_name: takeout-user
    ports:
      - "8081:8081"
    environment:
      - NACOS_SERVER_ADDR=47.99.34.251:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - NACOS_DISCOVERY_IP=121.41.228.22
      - MYSQL_HOST=47.99.34.251
      - MYSQL_PORT=3306
      - MYSQL_PASSWORD=123456
      - REDIS_HOST=47.99.34.251
      - REDIS_PORT=6379
      - REDIS_PASSWORD=123456
    depends_on:
      - nacos-check
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  merchant-service:
    image: takeout/merchant-service:latest
    container_name: takeout-merchant
