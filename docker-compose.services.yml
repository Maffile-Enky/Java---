    environment:
      - NACOS_SERVER_ADDR=47.99.34.251:8848
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
      - NACOS_DISCOVERY_IP=121.41.228.22
      - MYSQL_HOST=47.99.34.251
      - MYSQL_PORT=3306
      - MYSQL_PASSWORD=123456
      - RABBITMQ_HOST=47.99.34.251
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=takeout
