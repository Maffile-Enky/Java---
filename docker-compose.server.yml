services:
  gateway:
    image: takeout/gateway:latest
    container_name: takeout-gateway
    ports:
      - "9999:9999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NACOS_SERVER_ADDR=47.99.34.251:8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Djava.security.egd=file:/dev/./urandom
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '1.0'
        reservations:
          memory: 256M

  user-service:
    image: takeout/user-service:latest
    container_name: takeout-user
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
