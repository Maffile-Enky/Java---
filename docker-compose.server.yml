services:
  gateway:
    image: takeout-gateway:latest
    container_name: takeout-gateway
    ports:
      - "9999:9999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NACOS_SERVER_ADDR=47.99.34.251:8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  user-service:
    image: takeout-user:latest
    container_name: takeout-user
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NACOS_SERVER_ADDR=47.99.34.251:8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - MYSQL_HOST=host.docker.internal
      - SPRING_DATA_REDIS_HOST=host.docker.internal
      - SPRING_DATA_REDIS_PORT=6379
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  merchant-service:
    image: takeout-merchant:latest
    container_name: takeout-merchant
    ports:
      - "8083:8083"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NACOS_SERVER_ADDR=47.99.34.251:8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - MYSQL_HOST=host.docker.internal
      - SPRING_DATA_REDIS_HOST=host.docker.internal
      - SPRING_DATA_REDIS_PORT=6379
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  order-service:
    image: takeout-order:latest
    container_name: takeout-order
    ports:
      - "8084:8084"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NACOS_SERVER_ADDR=47.99.34.251:8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - MYSQL_HOST=host.docker.internal
      - RABBITMQ_HOST=host.docker.internal
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-takeout}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-123456}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  payment-service:
    image: takeout-payment:latest
    container_name: takeout-payment
    ports:
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NACOS_SERVER_ADDR=47.99.34.251:8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - MYSQL_HOST=host.docker.internal
      - RABBITMQ_HOST=host.docker.internal
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-takeout}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-123456}
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  notification-service:
    image: takeout-notification:latest
    container_name: takeout-notification
    ports:
      - "8086:8086"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NACOS_SERVER_ADDR=47.99.34.251:8848
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-nacos}
      - RABBITMQ_HOST=host.docker.internal
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-takeout}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-123456}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    image: takeout-frontend:latest
    container_name: takeout-frontend
    ports:
      - "80:80"
    depends_on:
      - gateway
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: takeout-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: takeout-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/takeout.json
    depends_on:
      - prometheus
    restart: unless-stopped
