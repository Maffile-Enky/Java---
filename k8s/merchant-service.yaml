apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-service
  namespace: takeout
  labels:
    app: merchant-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: merchant-service
  template:
    metadata:
      labels:
        app: merchant-service
    spec:
      containers:
        - name: merchant-service
          image: takeout/merchant-service:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: takeout-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-service
  namespace: takeout
spec:
  type: ClusterIP
  selector:
    app: merchant-service
  ports:
    - port: 8083
      targetPort: 8083
